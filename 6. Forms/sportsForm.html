<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Sports Physical Form</h2>

    <form action="actionPage.html" method="get">
      <fieldset>
        <legend><h4>Athlete Information</h4></legend>

        <ul>
          <li>
            <label for="name">Name: </label>
            <input type="text" name="username" id="name" />
          </li>
          <li>
            <label for="school">School/Team: </label>
            <input type="text" name="school" id="school" />
          </li>
          <li>
            <label for="sportName">Sports Name: </label>
            <input type="text" name="sportName" id="sportName" />
          </li>
          <li>
            <label for="parent_guardian_name">Parent/Guardian Name: </label>
            <input
              type="text"
              name="parent_guardian_name"
              id="parent_guardian_name"
            />
          </li>
          <li>
            <label for="contact">Contact Number: </label>
            <input type="text" name="contact" id="contact" />
          </li>

          <li></li>
        </ul>
      </fieldset>
      <fieldset>
        <legend><h4>Medical History for Athlete</h4></legend>
      </fieldset>
      <fieldset>
        <legend><h4>Doctor's Recommendation for sports Partition</h4></legend>
      </fieldset>
      <button type="submit">Form Submit</button>
    </form>
  </body>
</html>
