<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      section img {
        /* transform: rotate(0deg); */
        animation: translateBall 2s ease infinite;
      }
      #scale img {
        animation: scaleBall 2s ease infinite;
      }

      /**

            filter: url("/shared-assets/images/examples/shadow.svg#element-id");
      filter: blur(5px);
      filter: contrast(200%);
      filter: grayscale(10%);
      */

      @keyframes translateBall {
        0% {
          transform: translateX(0px) translateY(0px) scale(1) rotate(0deg);
          filter: blur(5px) grayscale(100%);
          /* transform:; */
          opacity: 1;
        }
        25% {
          /* transform: rotate(0deg); */
          transform: rotate(90deg) scale(1.5);
          filter: grayscale(100%);
          opacity: 0.5;
        }
        75% {
          transform: translateX(900px) rotate(180deg) scale(1.5);
          filter: grayscale(0%);
          opacity: 0.7;
        }
        100% {
          transform: rotate(360deg);
          filter: grayscale(100%);
          opacity: 0;
        }
      }
      @keyframes scaleBall {
        from {
          transform: scale(1), translateX(0px);
        }
        to {
          transform: scale(1.5);
        }
      }
    </style>
  </head>
  <body>
    <section>
      <img src="footbal.png" alt="" width="200px" />
    </section>
  </body>
</html>
