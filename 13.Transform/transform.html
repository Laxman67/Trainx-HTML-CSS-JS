<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      #box {
        width: 100px;
        height: 100px;
        background-color: red;
        transform: translateZ(50px);
        /* opacity: 1; */
      }
    </style>
  </head>
  <body>
    <div id="box">
      <p>
        The opacity CSS property sets the opacity (transparency) of an element.
        Opacity is the degree to which content behind an element is hidden, and
        is the opposite of transparency.
      </p>
    </div>
  </body>
</html>
