<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .items {
        width: 60%;
        height: 50px;
        margin: 0 auto;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 800;
      }
      .items-1 {
        background-color: salmon;
      }

      .items-2 {
        background-color: rgb(12, 223, 139);
      }
      #container {
        display: grid;
        grid-template-columns: repeat(2, minmax(500px, 1fr));
        gap: 2rem;
        grid-auto-rows: 500px;
      }
      .containers {
        padding: 1rem;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
      }
      .containers:nth-child(1) {
        background-color: rgb(202, 207, 207);
      }
      .containers:nth-child(2) {
        background-color: azure;
      }
      .dragging {
        opacity: 0.5;
        border: 2px solid red;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div class="containers">
        <div class="items items-1 draggables" draggable="true">1</div>
        <div class="items items-1 draggables" draggable="true">2</div>
        <div class="items items-1 draggables" draggable="true">3</div>
      </div>
      <div class="containers">
        <div class="items items-2 draggables" draggable="true">1</div>
        <div class="items items-2 draggables" draggable="true">2</div>
        <div class="items items-2 draggables" draggable="true">3</div>
      </div>
    </div>

    <div
      class="containers"
      style="background-color: bisque; width: 300px; height: 300px"
    ></div>
    <script src="script.js"></script>
  </body>
</html>
