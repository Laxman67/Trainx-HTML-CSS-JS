<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Step Job Application Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Job Application</h1>

      <!-- Progress Bar to simulate Form Progress -->
      <div class="progress">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <form id="jobForm">
        <!-- Step 1 -->
        <div class="step active">
          <h2>Personal Details</h2>

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullname" required />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required />
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" required />
          </div>

          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" />
          </div>

          <div class="buttons">
            <button type="button" class="next">Next</button>
          </div>
        </div>

        <!-- Step 2 -->
        <div class="step">
          <h2>Education</h2>

          <div class="form-group">
            <label>College Name</label>
            <input type="text" name="college" />
          </div>

          <div class="form-group">
            <label>Degree</label>
            <input type="text" name="degree" />
          </div>

          <div class="form-group">
            <label>Passing Year</label>
            <input type="number" name="year" />
          </div>

          <div class="form-group">
            <label>CGPA / Percentage</label>
            <input type="text" name="cgpa" />
          </div>

          <div class="buttons">
            <button type="button" class="prev">Previous</button>
            <button type="button" class="next">Next</button>
          </div>
        </div>

        <!-- Step 3 -->
        <div class="step">
          <h2>Experience</h2>

          <div class="form-group">
            <label>Experience</label>
            <input type="text" name="experience" />
          </div>

          <div class="form-group">
            <label>Skills</label>
            <textarea name="skills"></textarea>
          </div>

          <div class="form-group">
            <label>Expected Salary</label>
            <input type="number" name="salary" />
          </div>

          <div class="buttons">
            <button type="button" class="prev">Previous</button>
            <button type="button" class="next">Next</button>
          </div>
        </div>

        <!-- Step 4 -->
        <div class="step">
          <h2>Documents</h2>

          <div class="form-group">
            <label>Profile Image</label>
            <input type="file" name="profile" accept="image/*" />
          </div>

          <div class="form-group">
            <label>Resume (PDF)</label>
            <input type="file" name="resume" accept=".pdf" />
          </div>

          <div class="buttons">
            <button type="button" class="prev">Previous</button>
            <button type="button" class="next">Next</button>
          </div>
        </div>

        <!-- Step 5 -->
        <div class="step">
          <h2>Preview</h2>

          <div class="preview-box">
            <p><strong>Name:</strong> ________</p>
            <p><strong>Email:</strong> ________</p>
            <p><strong>Phone:</strong> ________</p>
            <p><strong>College:</strong> ________</p>
            <p><strong>Degree:</strong> ________</p>
            <p><strong>Experience:</strong> ________</p>
          </div>
          <iframe src="" frameborder="1" id="resumeFrame"></iframe>
          <img
            id="profileImg"
            src=""
            alt=""
            srcset=""
            width="100px"
            height="100px"
          />
          <div class="buttons">
            <button type="button" class="prev">Previous</button>
            <button type="submit">Submit</button>
          </div>
        </div>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
